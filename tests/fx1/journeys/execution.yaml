- id: execution-009
  category: execution
  title: A zero step budget skips harness lanes after the plan is shown
  critical: false
  in_chat: true
  setup:
    endpoints:
      fx1: ok
    harness:
      mode: fake
  steps:
    - say: /budget max-steps 0
      expect:
        - budget max_steps=0
    - say: /superpower score volatility forecasts --sync
      expect:
        - vol-bench
        - step budget exceeded
      forbid:
        - vol-bench finished
        - calibration-eval finished

- id: execution-010
  category: execution
  title: Repeated model timeouts stop the turn before any command runs
  critical: false
  in_chat: true
  setup:
    endpoints:
      fx1: ok
    replies:
      - error: 408
      - error: 408
      - error: 408
  steps:
    - say: please answer this health question now
      status: error
      expect:
        - did not answer before the timeout
      forbid:
        - doctor finished
        - stub fx1 reply

- id: execution-011
  category: execution
  title: One model timeout is retried and the answer still arrives
  critical: false
  in_chat: true
  setup:
    endpoints:
      fx1: ok
    replies:
      - error: 408
      - ok: "The pit histogram was flat. SYNTHETIC correctness check only."
  steps:
    - say: how should I read a flat pit histogram
      status: ok
      expect:
        - The pit histogram was flat. SYNTHETIC correctness check only.

- id: execution-012
  category: execution
  title: A session grant for train does not approve a typed paper command
  critical: false
  in_chat: true
  setup:
    endpoints:
      fx1: ok
    approvals:
      - decision: session
        key: harness:train
    harness:
      mode: fake
      commands:
        train:
          exit: 0
          stdout: "DATA_LABEL=SYNTHETIC\ntrain finished\n"
  steps:
    - say: /harness run train
      expect:
        - train finished
    - say: /harness run paper
      expect:
        - "[harness] paper: not approved — skipped"
      forbid:
        - paper finished
      approvals:
        - key: harness:paper
          approved: false
          scope: denied
    - say: /harness run train
      expect:
        - train finished
      approvals:
        - key: harness:train
          approved: true
          scope: session-reuse
