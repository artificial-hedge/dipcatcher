- id: execution-003
  category: execution
  title: A typed train command is denied when nobody can approve it
  critical: false
  in_chat: true
  setup:
    endpoints:
      fx1: ok
    harness:
      mode: fake
  steps:
    - say: /harness run train
      expect:
        - "[harness] train: not approved — skipped"
      forbid:
        - train finished
      approvals:
        - key: harness:train
          approved: false
          scope: no-prompter
          kind: consequential

- id: execution-004
  category: execution
  title: A session approval lets a second typed train run without asking again
  critical: false
  in_chat: true
  setup:
    endpoints:
      fx1: ok
    approvals:
      - decision: session
        key: harness:train
    harness:
      mode: fake
      commands:
        train:
          exit: 0
          stdout: "DATA_LABEL=SYNTHETIC\ntrain finished\n"
  steps:
    - say: /harness run train
      expect:
        - DATA_LABEL=SYNTHETIC
        - train finished
      approvals:
        - key: harness:train
          approved: true
          scope: session
    - say: /harness run train
      expect:
        - train finished
      approvals:
        - key: harness:train
          approved: true
          scope: session-reuse
    - say: /approvals
      expect:
        - session-reuse consequential key=harness:train approved=True

- id: execution-005
  category: execution
  title: A once approval does not cover a second typed train
  critical: false
  in_chat: true
  setup:
    endpoints:
      fx1: ok
    approvals:
      - decision: once
        key: harness:train
      - decision: deny
        key: harness:train
    harness:
      mode: fake
      commands:
        train:
          exit: 0
          stdout: "DATA_LABEL=SYNTHETIC\ntrain finished\n"
  steps:
    - say: /harness run train
      expect:
        - train finished
      approvals:
        - key: harness:train
          approved: true
          scope: once
    - say: /harness run train
      expect:
        - "[harness] train: not approved — skipped"
      forbid:
        - train finished
      approvals:
        - key: harness:train
          approved: false
          scope: denied

