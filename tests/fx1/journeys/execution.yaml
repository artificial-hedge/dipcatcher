- id: execution-007
  category: execution
  title: A typed doctor command that exits non-zero is reported as a failure
  critical: false
  in_chat: true
  setup:
    endpoints:
      fx1: ok
    harness:
      mode: fake
      commands:
        doctor:
          exit: 2
          stdout: "DATA_LABEL=SYNTHETIC\n"
          stderr: "doctor failed closed\n"
  steps:
    - say: /harness run doctor
      status: error
      expect:
        - DATA_LABEL=SYNTHETIC
        - doctor failed closed
      forbid:
        - doctor finished

