- id: planning-003
  category: planning
  title: A goal that names volatility and calibration keeps both eligible lanes
  critical: false
  in_chat: true
  setup:
    endpoints:
      fx1: ok
    harness:
      mode: fake
  steps:
    - say: score volatility forecasts and evaluate calibration with a pit score
      expect:
        - routing this to research orchestration
        - calibration-eval
        - vol-bench
      forbid:
        - alpha-decay
        - "excluded train"
    - wait_job: true
      expect:
        - calibration-eval finished
        - vol-bench finished
        - DATA_LABEL=SYNTHETIC

- id: planning-004
  category: planning
  title: An unqualified train request stays out while an eligible volatility lane runs
  critical: false
  in_chat: true
  setup:
    endpoints:
      fx1: ok
    harness:
      mode: fake
  steps:
    - say: run a lora train against these volatility forecasts
      expect:
        - vol-bench
        - "excluded train: unqualified"
        - missing qualification metadata fails closed
      forbid:
        - train finished
    - wait_job: true
      expect:
        - vol-bench finished
      forbid:
        - train finished

- id: planning-005
  category: planning
