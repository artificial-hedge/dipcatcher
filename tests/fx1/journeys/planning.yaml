- id: planning-012
  category: planning
  title: A model proposal with an unknown capability id is not executed
  critical: false
  in_chat: true
  setup:
    endpoints:
      fx1: ok
    replies:
      - ok: '{"rationale":"run it","steps":[{"args":{},"capability":"not-a-capability","why":"not in the catalog"}]}'
      - ok: "No lane was eligible. SYNTHETIC correctness check only."
    harness:
      mode: fake
  steps:
    - say: /superpower score volatility forecasts with QLIKE --sync
      expect:
        - "planner: model+validated"
        - "excluded not-a-capability: unknown_id: unknown capability id"
      forbid:
        - vol-bench finished
        - "- vol-bench"
