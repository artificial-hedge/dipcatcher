- id: planning-008
  category: planning
  title: Scoring my forecasts without a dataset keeps the bound runner ineligible
  critical: false
  in_chat: true
  setup:
    endpoints:
      fx1: ok
    harness:
      mode: fake
  steps:
    - say: score my forecasts
      expect:
        - "excluded forecast-eval: not_executable"
        - not registered in HARNESS_REGISTRY
        - "needs_dataset: no qualified dataset-bound runner matched"
        - "SYNTHETIC correctness evidence only — it does not evaluate your data"
      forbid:
        - forecast-eval finished
    - wait_job: true
      expect:
        - does not evaluate your data
      forbid:
        - forecast-eval finished

- id: planning-009
  category: planning
  title: An explicit ten-second budget drops lanes whose estimate is longer
  critical: false
  in_chat: true
  setup:
    endpoints:
      fx1: ok
    harness:
      mode: fake
  steps:
    - say: /budget max-seconds 10
      expect:
        - budget max_seconds=10.0
    - say: /superpower score volatility forecasts with QLIKE --sync
      expect:
        - estimated runtime exceeds budget
        - "No suitable capability"
        - max_seconds=10.0
      forbid:
        - vol-bench finished
        - calibration-eval finished

- id: planning-010
  category: planning
  title: A one-command harness budget keeps a single eligible lane
  critical: false
  in_chat: true
  setup:
    endpoints:
      fx1: ok
    harness:
      mode: fake
  steps:
    - say: /budget max-harness 1
      expect:
        - budget max_harness=1
    - say: /superpower score volatility forecasts and evaluate calibration with a pit score --sync
      expect:
        - exceed max_steps=1
        - "excluded vol-bench: max_steps"
        - calibration-eval finished
      forbid:
        - vol-bench finished

