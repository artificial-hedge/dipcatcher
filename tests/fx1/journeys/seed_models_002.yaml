- id: models-002
  category: models
  title: Switching models mid-conversation keeps the earlier turn
  critical: false
  in_chat: true
  setup:
    endpoints:
      fx1: ok
      fx1-lite: ok
  steps:
    - say: remember the pinball score discussion
      expect:
        - "stub fx1 reply"
    - say: /use fx1-lite
      expect:
        - conversation kept
        - fx1-lite
      model: fx1-lite
    - say: continue from the pinball discussion
      model: fx1-lite
      sent:
        - remember the pinball score discussion
        - active model changed from fx1 to fx1-lite
  final:
    session:
      model: fx1-lite
      messages_contain:
        - remember the pinball score discussion
        - continue from the pinball discussion
