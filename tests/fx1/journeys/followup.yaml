- id: followup-008
  category: followup
  title: A private flash note is withheld from the model and from the follow-up
  critical: true
  in_chat: true
  setup:
    endpoints:
      fx1: ok
    replies:
      - tool_call:
          name: flash_retrieve
          args:
            query: account ledger note
        ok: ""
      - ok: "No private ledger was available to summarize."
    flash:
      - text: "account ledger note PRIVATE-ACCOUNT-991122 stays on disk"
        task: accounts
        private: true
        tags:
          - account
          - ledger
  steps:
    - say: look up the account ledger note
      expect:
        - No private ledger was available to summarize.
      forbid:
        - PRIVATE-ACCOUNT-991122
      approvals:
        - approved: false
          scope: no-prompter
          kind: private_data
      session:
        messages_forbid:
          - PRIVATE-ACCOUNT-991122
    - say: what was in memory?
      sent:
        - look up the account ledger note
      forbid:
        - PRIVATE-ACCOUNT-991122
      session:
        messages_forbid:
          - PRIVATE-ACCOUNT-991122

