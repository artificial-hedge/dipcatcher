- id: recovery-001
  category: recovery
  title: Restart leaves an interrupted job stopped
  critical: true
  in_chat: true
  setup:
    endpoints:
      fx1: missing
    sessions:
      - model: fx1
        messages:
          - role: user
            content: score volatility forecasts
        job:
          state: running
    jobs:
      - kind: superpower
        goal: score volatility forecasts
        state: running
  steps:
    - say: /resume
      expect:
        - not restarted
        - interrupted
    - restart: true
    - say: /resume
      expect:
        - not restarted
    - say: /status
      expect:
        - no background job
      forbid:
        - running in the background
  final:
    job: interrupted
    restarted: false
