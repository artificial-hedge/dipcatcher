- id: verification-001
  category: verification
  title: A forbidden-metric reply is withheld and a proper score can follow
  critical: true
  in_chat: true
  setup:
    endpoints:
      fx1: ok
    replies:
      - violation: forbidden_headline
      - ok: QLIKE is 0.12. SYNTHETIC correctness check only.
  steps:
    - say: headline the strategy
      expect:
        - withheld
        - honesty gate
      forbid:
        - Sharpe is 2.4
      status: withheld
    - say: give a proper score instead
      expect:
        - QLIKE
        - SYNTHETIC
      status: ok
