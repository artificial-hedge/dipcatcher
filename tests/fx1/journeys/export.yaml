- id: export-002
  category: export
  title: Export before a session is refused, then a second markdown write is refused
  critical: false
  in_chat: true
  setup:
    endpoints:
      fx1: ok
  steps:
    - say: /export md
      expect:
        - "no persisted session to export"
      status: error
    - say: pinball loss in one sentence
      expect:
        - "stub fx1 reply"
      model: fx1
    - say: /export md
      expect:
        - "exported session"
      files:
        - path: config:exports
          glob: "*.md"
          exists: true
          mode: "0600"
          contains:
            - "pinball loss in one sentence"
            - "model: fx1"
            - "**user**"
          forbid:
            - "{key_fx1}"
            - "{key_lite}"
    - say: /export md
      expect:
        - "refusing to overwrite"

- id: export-003
  category: export
  title: Markdown and JSON exports record the switch from fx1 to fx1-lite
  critical: false
  in_chat: true
  setup:
    endpoints:
      fx1: ok
      fx1-lite: ok
  steps:
    - say: remember the pinball definition
      expect:
        - "stub fx1 reply"
      model: fx1
    - say: /use fx1-lite
      expect:
        - fx1-lite
      model: fx1-lite
    - say: shorten that definition
      expect:
        - "stub fx1-lite reply"
      model: fx1-lite
    - say: /export md
      expect:
        - "exported session"
      files:
        - path: config:exports
          glob: "*.md"
          exists: true
          contains:
            - "model switch: fx1 -> fx1-lite"
            - "remember the pinball definition"
            - "shorten that definition"
            - "model: fx1-lite"
          forbid:
            - "{key_fx1}"
            - "{key_lite}"
    - say: /export json
      expect:
        - "exported session"
      files:
        - path: config:exports
          glob: "*.json"
          exists: true
          mode: "0600"
          contains:
            - "remember the pinball definition"
            - "shorten that definition"
            - "fx1-lite"
            - "active model changed from fx1 to fx1-lite"
          forbid:
            - "{key_fx1}"
            - "{key_lite}"

- id: export-004
  category: export
  title: A withheld headline is exported as an honesty outcome, not as the score
  critical: true
  in_chat: true
  setup:
    endpoints:
      fx1: ok
    replies:
      - violation: forbidden_headline
  steps:
    - say: headline that result for the desk
      expect:
        - "answer withheld by the fx-1 honesty gate"
        - "proper scores"
      forbid:
        - "2.4"
      status: withheld
      model: fx1
    - say: /export md
      expect:
        - "exported session"
      files:
        - path: config:exports
          glob: "*.md"
          exists: true
          contains:
            - "withheld-by-honesty-gate"
          forbid:
            - "2.4"
            - "Sharpe is"
            - "{key_fx1}"

- id: export-005
  category: export
  title: A model echo of the API key is redacted in the chat and the export
  critical: true
  in_chat: true
  setup:
    endpoints:
      fx1: ok
    accept_keys:
      fx1: user-typed-fx1-key-aaaa1111
    replies:
      - ok: "QLIKE is 0.2. The token user-typed-fx1-key-aaaa1111 should not be shown."
  steps:
    - say: repeat the score and do not repeat secrets
      expect:
        - "QLIKE is 0.2."
        - "[REDACTED]"
      forbid:
        - "{key_fx1}"
      status: ok
      model: fx1
    - say: /export md
      expect:
        - "exported session"
      files:
        - path: config:exports
          glob: "*.md"
          exists: true
          contains:
            - "QLIKE is 0.2."
            - "[REDACTED]"
            - "repeat the score and do not repeat secrets"
          forbid:
            - "{key_fx1}"

- id: export-006
  category: export
  title: The markdown alias writes a private file at the operator path
  critical: false
  in_chat: true
  setup:
    endpoints:
      fx1-lite: ok
  steps:
    - say: /use fx1-lite
      expect:
        - fx1-lite
      model: fx1-lite
    - say: lite summary of pinball loss
      expect:
        - "stub fx1-lite reply"
      model: fx1-lite
    - say: /export markdown notes/pinball.md
      expect:
        - "exported session"
        - "notes/pinball.md"
      files:
        - path: notes/pinball.md
          exists: true
          mode: "0600"
          contains:
            - "lite summary of pinball loss"
            - "stub fx1-lite reply"
            - "model: fx1-lite"
          forbid:
            - "{key_lite}"
            - "{key_fx1}"

- id: export-007
  category: export
  title: An export of a user-data request keeps the SYNTHETIC limit
  critical: true
  in_chat: true
  setup:
    endpoints:
      fx1: ok
    harness:
      mode: fake
  steps:
    - say: evaluate my data volatility forecasts
      expect:
        - "routing this to research orchestration"
        - "SYNTHETIC correctness evidence only"
        - "does not evaluate your data"
    - wait_job: true
      expect:
        - "DATA_LABEL=SYNTHETIC"
    - say: /export md
      expect:
        - "exported session"
      files:
        - path: config:exports
          glob: "*.md"
          exists: true
          contains:
            - "evaluate my data volatility forecasts"
            - "SYNTHETIC"
          forbid:
            - "{key_fx1}"
            - "live trading profits"

- id: export-008
  category: export
  title: An export does not copy a private flash note that was never retrieved
  critical: true
  in_chat: true
  setup:
    endpoints:
      fx1: ok
    flash:
      - text: "session note: pinball is a proper score"
        task: scores
        tags: [pinball]
        private: false
      - text: PRIVATE-ACCOUNT-991122 pinball account note
        task: scores
        tags: [pinball]
        private: true
    replies:
      - ok: "Pinball is a proper score. I did not open the desk blotter."
  steps:
    - say: define pinball loss without opening private notes
      expect:
        - "Pinball is a proper score."
      forbid:
        - PRIVATE-ACCOUNT-991122
      session:
        messages_forbid:
          - PRIVATE-ACCOUNT-991122
    - say: /export json
      expect:
        - "exported session"
      files:
        - path: config:exports
          glob: "*.json"
          exists: true
          contains:
            - "define pinball loss without opening private notes"
            - "Pinball is a proper score."
          forbid:
            - PRIVATE-ACCOUNT-991122
            - "{key_fx1}"
