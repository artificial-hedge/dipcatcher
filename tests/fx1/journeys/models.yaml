- id: models-006
  category: models
  title: Two server errors surface, then the next turn recovers
  critical: false
  in_chat: true
  setup:
    endpoints:
      fx1: ok
    replies:
      - error: 500
      - error: 500
      - ok: "QLIKE is finite again after the outage."
  steps:
    - say: the host just blipped, what is the pinball score?
      expect:
        - "The model server failed this request"
      forbid:
        - "QLIKE is finite again"
        - "{key_fx1}"
      status: error
      model: fx1
    - say: try the pinball score once more
      expect:
        - "QLIKE is finite again after the outage."
      forbid:
        - "{key_fx1}"
      status: ok
      model: fx1

- id: models-007
  category: models
  title: A timeout stays on fx1, then fx1-lite can answer the follow-up
  critical: false
  in_chat: true
  setup:
    endpoints:
      fx1: ok
      fx1-lite: ok
    replies:
      - error: 408
      - error: 408
      - ok: "Pinball stays a proper score."
  steps:
    - say: hello from the slow side
      expect:
        - "did not answer before the timeout"
      forbid:
        - "Pinball stays a proper score."
        - "{key_fx1}"
      status: error
      model: fx1
    - say: /use fx1-lite
      expect:
        - "conversation kept"
        - fx1-lite
      model: fx1-lite
    - say: give me the pinball line
      expect:
        - "Pinball stays a proper score."
      forbid:
        - "{key_lite}"
      status: ok
      model: fx1-lite
      sent:
        - "give me the pinball line"

- id: models-008
  category: models
  title: Permission and quota failures name the problem and do not invent a score
  critical: false
  in_chat: true
  setup:
    endpoints:
      fx1: ok
    replies:
      - error: 403
      - error: 402
  steps:
    - say: hello
      expect:
        - "not allowed to call the model"
      forbid:
        - "stub fx1 reply"
        - "{key_fx1}"
      status: error
      model: fx1
    - say: hello again after the quota check
      expect:
        - "no remaining quota"
        - "retrying will not succeed"
      forbid:
        - "stub fx1 reply"
        - "{key_fx1}"
      status: error
      model: fx1

- id: models-009
  category: models
  title: Switching to an unconfigured fx1-lite keeps the fx1 turn
  critical: false
  in_chat: true
  setup:
    endpoints:
      fx1: ok
      fx1-lite: missing
  steps:
    - say: remember pinball is a proper score
      expect:
        - "stub fx1 reply"
      model: fx1
    - say: /use fx1-lite
      expect:
        - "conversation kept"
        - "fx1-lite has no endpoint configured"
      model: fx1-lite
    - say: now summarize that
      expect:
        - "/keys set fx1-lite"
      forbid:
        - "stub fx1-lite reply"
      status: no_endpoint
      model: fx1-lite
    - say: /use fx1
      expect:
        - "conversation kept"
      model: fx1
    - say: what did I just say about pinball?
      expect:
        - "stub fx1 reply"
      model: fx1
      sent:
        - "remember pinball is a proper score"
        - "active model changed from fx1 to fx1-lite"
      session:
        model: fx1
        messages_contain:
          - "remember pinball is a proper score"
          - "what did I just say about pinball?"

- id: models-010
  category: models
  title: The models table hides the key, and removing fx1 drops the endpoint
  critical: true
  in_chat: true
  setup:
    endpoints:
      fx1: ok
      fx1-lite: ok
    accept_keys:
      fx1: user-typed-fx1-key-aaaa1111
      fx1-lite: user-typed-lite-key-bbbb2222
  steps:
    - say: hello from the desk
      expect:
        - "stub fx1 reply"
      forbid:
        - "{key_fx1}"
        - "{key_lite}"
      model: fx1
    - say: /models
      expect:
        - fx1
        - fx1-lite
        - set
      forbid:
        - "{key_fx1}"
        - "{key_lite}"
      model: fx1
    - say: /keys list
      expect:
        - "...1111"
        - "...2222"
      forbid:
        - "{key_fx1}"
        - "{key_lite}"
    - say: /keys remove fx1
      expect:
        - "removed endpoint 'fx1'"
      forbid:
        - "{key_fx1}"
    - say: hello again
      expect:
        - "no model endpoint configured"
        - "/keys set fx1"
      forbid:
        - "{key_fx1}"
        - "stub fx1 reply"
      status: no_endpoint
      model: fx1
