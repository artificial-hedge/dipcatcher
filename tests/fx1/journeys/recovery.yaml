- id: recovery-009
  category: recovery
  title: fx1 stays down while fx1-lite still answers in the same chat
  critical: true
  in_chat: true
  setup:
    endpoints:
      fx1: down
      fx1-lite: ok
  steps:
    - say: hello on the primary model
      expect:
        - HTTP 503
      forbid:
        - stub fx1 reply
      status: error
      model: fx1
    - say: /use fx1-lite
      expect:
        - conversation kept
        - fx1-lite
      model: fx1-lite
    - say: summarize pinball in one sentence
      expect:
        - stub fx1-lite reply
      forbid:
        - HTTP 503
      status: ok
      model: fx1-lite
    - say: /use fx1
      expect:
        - conversation kept
      model: fx1
    - say: hello again on the primary model
      expect:
        - HTTP 503
      forbid:
        - stub fx1 reply
        - stub fx1-lite reply
      status: error
      model: fx1
- id: recovery-010
  category: recovery
  title: Restart after a chat restores the turn and does not start a job
  critical: true
  in_chat: true
  setup:
    endpoints:
      fx1: ok
  steps:
    - say: Define pinball loss for this live session.
      expect:
        - stub fx1 reply
      status: ok
    - restart:
        resume: true
      expect:
        - resumed session
      forbid:
        - running in the background
        - not restarted
    - say: Use that definition in one sentence.
      expect:
        - stub fx1 reply
      sent:
        - Define pinball loss for this live session.
      status: ok
      model: fx1
  final:
    restarted: false
    session:
      turns_at_least: 2
      model: fx1
      messages_contain:
        - Define pinball loss for this live session.
        - Use that definition in one sentence.
