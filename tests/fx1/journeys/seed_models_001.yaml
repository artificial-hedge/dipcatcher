- id: models-001
  category: models
  title: Masked /keys set stores both models and does not echo the key
  critical: true
  in_chat: true
  setup:
    endpoints:
      fx1: missing
      fx1-lite: missing
    accept_keys:
      fx1: user-typed-fx1-key-aaaa1111
      fx1-lite: user-typed-lite-key-bbbb2222
  steps:
    - say: /keys set fx1
      secret: "{key_fx1}"
      input: "{stub_url}"
      expect:
        - "stored for 'fx1'"
      forbid:
        - "{key_fx1}"
      files:
        - path: config:credentials.json
          exists: true
          mode: "0600"
    - say: /keys set fx1-lite
      secret: "{key_lite}"
      input: "{stub_url}"
      expect:
        - "stored for 'fx1-lite'"
      forbid:
        - "{key_lite}"
    - say: hello after keys
      expect:
        - "stub fx1 reply"
      forbid:
        - "{key_fx1}"
        - "{key_lite}"
      status: ok
      model: fx1
