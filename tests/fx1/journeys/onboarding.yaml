- id: onboarding-012
  category: onboarding
  title: A budget override stores a step ceiling and rejects a dollar field
  critical: false
  in_chat: true
  setup:
    endpoints:
      fx1: missing
  steps:
    - say: /budget max-steps 2
      expect:
        - "budget max_steps=2"
    - say: /budget
      expect:
        - "max_steps=2"
        - "not a dollar cap"
    - say: /budget max-steps lots
      expect:
        - "max-steps needs a number"
      status: error
    - say: /budget max-dollars 5
      expect:
        - "unknown budget field 'max-dollars'"
      status: error
      model: fx1
