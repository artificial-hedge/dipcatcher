- id: execution-001
  category: execution
  title: train is denied when nobody is available to approve it
  critical: false
  in_chat: true
  setup:
    endpoints:
      fx1: ok
    replies:
      - tool_call:
          name: harness_run
          args:
            name: train
            args: []
      - ok: I did not run train.
  steps:
    - say: please train the lab model
      expect:
        - not approved
        - I did not run train.
      forbid:
        - train finished
      approvals:
        - key: harness:train
          approved: false
          scope: no-prompter
