- id: data-002
  category: data
  title: Private flash stays out of the transcript when retrieval runs
  critical: true
  in_chat: true
  setup:
    endpoints:
      fx1: ok
    flash:
      - text: "session note: pinball is a proper score"
        task: scores
        tags: [pinball]
        private: false
      - text: PRIVATE-ACCOUNT-991122 pinball account note
        task: scores
        tags: [pinball]
        private: true
    replies:
      - tool_call:
          name: flash_retrieve
          args:
            query: pinball
      - ok: I found a saved note.
  steps:
    - say: what did we save about pinball
      expect:
        - I found a saved note.
      session:
        messages_contain:
          - "session note: pinball is a proper score"
        messages_forbid:
          - PRIVATE-ACCOUNT-991122
