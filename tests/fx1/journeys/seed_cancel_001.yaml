- id: cancel-001
  category: cancel
  title: Cancel during an in-flight model turn drops the reply
  critical: true
  in_chat: true
  setup:
    endpoints:
      fx1: ok
    replies:
      - ok: this should not be shown
        delay_s: 0.5
  steps:
    - say: think about pinball
    - cancel: turn
      expect:
        - turn cancelled
      forbid:
        - this should not be shown
      status: cancelled
