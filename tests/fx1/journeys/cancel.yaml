- id: cancel-003
  category: cancel
  title: Cancel during planning stops the run before a background job starts
  critical: true
  in_chat: true
  setup:
    endpoints:
      fx1: ok
    replies:
      - ok: this plan should not be executed
        delay_s: 0.5
  steps:
    - say: score volatility forecasts with QLIKE
    - cancel: turn
      expect:
        - turn cancelled
        - model call failed
      forbid:
        - running in the background
        - vol-bench finished
        - evidence status
        - this plan should not be executed
      status: cancelled
  final:
    restarted: false
- id: cancel-004
  category: cancel
  title: Cancel during a tool-calling turn never starts the harness command
  critical: true
  in_chat: true
  setup:
    endpoints:
      fx1: ok
    replies:
      - tool_call:
          name: harness_run
          args:
            name: train
            args: []
        delay_s: 0.5
      - ok: I did not run train.
  steps:
    - say: please train the lab model
    - cancel: turn
      expect:
        - turn cancelled
      forbid:
        - train finished
        - not approved
        - I did not run train.
      status: cancelled
      approvals: []
  final:
    restarted: false
- id: cancel-005
  category: cancel
  title: Cancel during a running job drops the draft and stops later steps
  critical: true
  in_chat: true
  setup:
    endpoints:
      fx1: ok
    replies:
      - ok: not json at all
      - ok: SECRET SUMMARY should not show
        delay_s: 0.6
  steps:
    - say: score volatility forecasts with QLIKE
      expect:
        - running in the background
    - cancel: job
      expect:
        - cancel requested
        - cancellation pending
    - wait_job: true
      expect:
        - synthesis cancelled
        - cancelled before execution
      forbid:
        - SECRET SUMMARY should not show
    - say: /status
      expect:
        - "[superpower] finished"
      forbid:
        - SECRET SUMMARY should not show
        - running in the background
  final:
    restarted: false
- id: cancel-006
  category: cancel
  title: A second cancel after the research job has stopped finds nothing running
  critical: true
  in_chat: true
  setup:
    endpoints:
      fx1: missing
    research:
      hold: true
  steps:
    - say: /research volatility notes
      expect:
        - running in the background
    - cancel: job
      expect:
        - cancel requested
        - cancellation pending
    - wait_job: true
      expect:
        - cancelled
        - not a sealed dipcatcher research receipt
      forbid:
        - verified receipt
    - say: /cancel
      expect:
        - no running background job
    - say: /status
      expect:
        - "[research] finished"
      forbid:
        - running in the background
  final:
    restarted: false
- id: cancel-007
  category: cancel
  title: Cancel with no job leaves the next chat turn usable
  critical: true
  in_chat: true
  setup:
    endpoints:
      fx1: ok
  steps:
    - say: /cancel
      expect:
        - no running background job
      status: ok
    - say: hello after the idle cancel
      expect:
        - stub fx1 reply
      forbid:
        - turn cancelled
      status: ok
      model: fx1
  final:
    restarted: false
- id: cancel-008
  category: cancel
  title: A cancelled turn is dropped before the next request is sent
  critical: true
  in_chat: true
  setup:
    endpoints:
      fx1: ok
    replies:
      - ok: should not show pinball
        delay_s: 0.5
      - ok: Nothing from that turn is in context.
  steps:
    - say: remember the pinball discussion please
    - cancel: turn
      expect:
        - turn cancelled
      forbid:
        - should not show pinball
      status: cancelled
    - say: what did I just ask you to remember
      expect:
        - Nothing from that turn is in context.
      forbid:
        - should not show pinball
      status: ok
      session:
        messages_contain:
          - what did I just ask you to remember
        messages_forbid:
          - remember the pinball discussion please
          - should not show pinball
  final:
    restarted: false
