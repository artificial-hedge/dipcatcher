title = "dipcatcher"

[extend]
useDefault = true

# Keep exceptions bound to the exact documented fixtures. A blanket allowlist
# for 40- or 64-character hex strings can mask real credential material.
[[allowlists]]
description = "Pinned public model revisions"
targetRules = ["generic-api-key"]
condition = "AND"
paths = ['''(?:^|/)src/quant_fund/models/robinhood_plus/constants\.py$''']
regexTarget = "line"
regexes = ['''(?i)^\s*"(?:tokenizer_rev|model_rev)":\s*"[0-9a-f]{40}",?\s*$''']

[[allowlists]]
description = "MkDocs API stability navigation target"
targetRules = ["generic-api-key"]
condition = "AND"
paths = ['''(?:^|/)mkdocs\.yml$''']
regexTarget = "line"
regexes = ['''^\s*-\s*API stability:\s*FX1_API_STABILITY\.md\s*$''']

[[allowlists]]
description = "Historical eval JSON stores public tokenizer sha256 digests"
targetRules = ["generic-api-key"]
condition = "AND"
paths = ['''(?:^|/)\.dsh-24x7/.*\.json$''']
regexTarget = "line"
regexes = ['''(?i)^\s*"(?:kronos_small_tokenizer|kronos_base_tokenizer|tokenizer_artifact_sha256)":\s*"[0-9a-f]{64}",?\s*$''']

[[allowlists]]
description = "Synthetic credential-leak regression canary"
targetRules = ["generic-api-key"]
condition = "AND"
paths = ['''(?:^|/)tests/fx1/test_sources\.py$''']
regexes = ['''^sk-test-SECRET-123$''']

# .dsh-24x7 is a committed evidence directory: its JSON files pin data
# files, model artifacts, and script contents by sha256 digest, under keys
# as varied as model names ("kronos_small"), symbols ("BTCUSDT"), and file
# names ("d1_btcusdt_1d.parquet"). The generic-api-key rule fires on every
# 64-hex value. The allowlist is scoped to that directory and to JSON
# string-key -> 64-hex-value lines only.
[[allowlists]]
description = "SHA256 content digests in committed .dsh-24x7 evidence JSON"
targetRules = ["generic-api-key"]
condition = "AND"
paths = ['''(?:^|/)\.dsh-24x7/.*\.json$''']
regexTarget = "line"
regexes = ['''^\s*"[^"]{1,300}":\s*"[0-9a-f]{64}",?\s*$''']

# The paper-replication registry keys StrategySpec entries as
# key="str_<paper><year>" — `key="..."` assignment lines match the
# generic-api-key shape even though the values are strategy identifiers,
# not credentials. Scoped to that one file and lowercase-identifier
# values only.
[[allowlists]]
description = "Paper-replication registry strategy keys (identifiers, not credentials)"
targetRules = ["generic-api-key"]
condition = "AND"
paths = ['''(?:^|/)src/quant_fund/research/replication/strategies\.py$''']
regexTarget = "line"
regexes = ['''^\+?\s*(?:key|paper_key|signal_fn)\s*=\s*"[a-z0-9_]+",?\s*$''']

# quality/crown_jewels.json is a manifest of file paths → sha256 content
# digests. A path containing `key` (key_rotation.py) next to its 64-hex
# digest matches generic-api-key's shape but is a content pin, not a
# credential — the same class as the .dsh-24x7 evidence allowlist.
[[allowlists]]
description = "Crown-jewels manifest: file paths pinned by sha256 content digest"
targetRules = ["generic-api-key"]
condition = "AND"
paths = ['''(?:^|/)quality/crown_jewels\.json$''']
regexTarget = "line"
regexes = ['''^\s*"[^"]{1,300}\.[a-z0-9]{1,8}":\s*"[0-9a-f]{64}",?\s*$''']

# docs/maintenance validation manifests pin OpenAPI documents by sha256
# ("actual_openapi_sha256" / "proposed_openapi_sha256" -> 64-hex digest).
# Content pins, not credentials; scoped to those key names and digest
# values only.
[[allowlists]]
description = "Maintenance manifests: OpenAPI documents pinned by sha256 digest"
targetRules = ["generic-api-key"]
condition = "AND"
paths = ['''(?:^|/)docs/maintenance/.+\.json$''']
regexTarget = "line"
regexes = ['''^\s*"(?:actual|proposed)_openapi_sha256":\s*"[0-9a-f]{64}",?\s*$''']

# docs/maintenance/fault-validation-*.json narrates a fault battery in
# prose; one sentence says "tokens on token-write failure,
# scope/expiry/rotation semantics". generic-api-key keyed on the word
# "token" and swallowed the following phrase. English, not a credential —
# bound to that exact sentence fragment and file family.
[[allowlists]]
description = "Fault-validation narrative prose (sentence fragment, not a credential)"
targetRules = ["generic-api-key"]
condition = "AND"
paths = ['''(?:^|/)docs/maintenance/fault-validation-[^/]*\.json$''']
regexTarget = "line"
regexes = ['''token-write failure,\s*scope/expiry/rotation semantics''']

# tests/fx1/operation_cases_chunk2.py carries a checkpoint-verification
# case whose `supplied_key_sha256` is the sha256 FINGERPRINT of a test key
# (the key id is its first 16 hex chars) — a fingerprint cannot authenticate
# anything. Same class as the digest allowlists above.
[[allowlists]]
description = "Test fixture: sha256 key fingerprint in a checkpoint case"
targetRules = ["generic-api-key"]
condition = "AND"
paths = ['''(?:^|/)tests/fx1/operation_cases_chunk2\.py$''']
regexTarget = "line"
regexes = ['''^\s*"supplied_key_sha256":\s*"[0-9a-f]{64}",?\s*$''']

# The checkpoint-verifier operation case also embeds a deterministic Ed25519
# public key. This is public verification material, not a credential; keep the
# exception restricted to the fixture, rule, and explicit public_key field.
[[allowlists]]
description = "Deterministic checkpoint fixture Ed25519 public key"
targetRules = ["generic-api-key"]
condition = "AND"
paths = ['''(?:^|/)tests/fx1/operation_cases_chunk2\.py$''']
regexTarget = "line"
regexes = ['''"public_key":"[0-9a-f]{64}"''']

# web/public/fixtures/index.json maps sha256 content digests -> fixture
# receipt paths ("64-hex": "receipts/<name>.json"). Same content-pin class
# as the .dsh-24x7 evidence allowlist. generic-api-key's match here spans
# a line break (path line tail -> next line's digest key), so line-targeted
# regexes cannot see it; target the captured secret instead and require it
# to be exactly a lowercase 64-hex digest, in this one manifest only.
[[allowlists]]
description = "Web fixture manifest: sha256 digest -> fixture path pins"
targetRules = ["generic-api-key"]
condition = "AND"
paths = ['''(?:^|/)web/public/fixtures/index\.json$''']
regexTarget = "secret"
regexes = ['''^[0-9a-f]{64}$''']
