# Lab API, research API, Prometheus, and Grafana.
# Research and simulated paper only. No live broker and no order path.
# Export QUANT_API_KEY and RESEARCH_API_KEY before
# `docker compose -f deploy/compose.prod.yml up`. The interpolation below
# refuses to start when either variable is missing. deploy/prod.env sets
# the production profile, a positive rate limit, and the data-dir write
# probe. It contains no secrets.
# Metrics bind inside the compose network and are not published. Prometheus
# writes bearer tokens at start and scrapes lab-api:9464 and research-api:9464.
# smoke-up plants a SYNTHETIC manifest and receipt, then serves the lab API.
# Host ports stay on loopback. Override LAB_PUBLISH_PORT (8000),
# RESEARCH_PUBLISH_PORT (8010), PROMETHEUS_PUBLISH_PORT (9090), and
# GRAFANA_PUBLISH_PORT (3000) when those ports are already taken.

name: dipcatcher-ops6

services:
  lab-api:
    build:
      context: ..
      dockerfile: Dockerfile
    image: dipcatcher:local
    command: ["dipcatcher", "smoke-up"]
    env_file:
      - ./prod.env
    environment:
      PORT: "8000"
      DIPCATCHER_BIND_HOST: 0.0.0.0
      DIPCATCHER_BIND_PORT: "8000"
      QUANT_API_KEY: ${QUANT_API_KEY:?set QUANT_API_KEY in the environment}
      DIPCATCHER_OBSERVE: "1"
      DIPCATCHER_METRICS_HOST: 0.0.0.0
      DIPCATCHER_METRICS_PORT: "9464"
      DIPCATCHER_METRICS_KEY_ENV: QUANT_API_KEY
      DIPCATCHER_LOG_LEVEL: INFO
      DIPCATCHER_SHUTDOWN_GRACE_S: "20"
      DIPCATCHER_DATA_ROOT: /app/data
      DIPCATCHER_KILL_SWITCH_PATH: /app/data/kill_switch
    ports:
      - "127.0.0.1:${LAB_PUBLISH_PORT:-8000}:8000"
    stop_signal: SIGTERM
    stop_grace_period: 30s

  research-api:
    build:
      context: ..
      dockerfile: docker/research-api.Dockerfile
    image: dipcatcher-research-api
    command: ["python", "-m", "quant_fund.api.research_api"]
    env_file:
      - ./prod.env
    environment:
      RESEARCH_API_HOST: 0.0.0.0
      RESEARCH_API_PORT: "8010"
      RESEARCH_API_KEY: ${RESEARCH_API_KEY:?set RESEARCH_API_KEY in the environment}
      DIPCATCHER_OBSERVE: "1"
      DIPCATCHER_METRICS_HOST: 0.0.0.0
      DIPCATCHER_METRICS_PORT: "9464"
      DIPCATCHER_METRICS_KEY_ENV: RESEARCH_API_KEY
      DIPCATCHER_LOG_LEVEL: INFO
      DIPCATCHER_SHUTDOWN_GRACE_S: "20"
      DIPCATCHER_DATA_ROOT: /app/data
      DIPCATCHER_KILL_SWITCH_PATH: /app/data/kill_switch
    ports:
      - "127.0.0.1:${RESEARCH_PUBLISH_PORT:-8010}:8010"
    stop_signal: SIGTERM
    stop_grace_period: 30s

  prometheus:
    image: prom/prometheus:v2.54.1
    entrypoint: ["/bin/sh", "/etc/prometheus/prometheus-entrypoint.sh"]
    command: []
    environment:
      QUANT_API_KEY: ${QUANT_API_KEY:?set QUANT_API_KEY in the environment}
      RESEARCH_API_KEY: ${RESEARCH_API_KEY:?set RESEARCH_API_KEY in the environment}
    volumes:
      - ./observability/prometheus.yml:/etc/prometheus/prometheus.yml:ro
      - ./observability/alerts.yml:/etc/prometheus/alerts.yml:ro
      - ./observability/prometheus-entrypoint.sh:/etc/prometheus/prometheus-entrypoint.sh:ro
    ports:
      - "127.0.0.1:${PROMETHEUS_PUBLISH_PORT:-9090}:9090"
    depends_on:
      lab-api:
        condition: service_healthy
      research-api:
        condition: service_healthy

  grafana:
    image: grafana/grafana:11.2.0
    environment:
      GF_AUTH_ANONYMOUS_ENABLED: "true"
      GF_AUTH_ANONYMOUS_ORG_ROLE: Viewer
    volumes:
      - ./observability/grafana/provisioning:/etc/grafana/provisioning:ro
      - ./observability/grafana/dashboards:/var/lib/grafana/dashboards:ro
    ports:
      - "127.0.0.1:${GRAFANA_PUBLISH_PORT:-3000}:3000"
    depends_on:
      - prometheus
