# Collector, Prometheus, and Grafana. Bind addresses are loopback. Anonymous
# Grafana is a viewer on this machine only; the image default admin password
# is unchanged and this file does not set one. Do not publish these ports on
# a shared network. Prometheus scrapes lab-api and research-api, which exist
# on the deploy/compose.prod.yml network. The full stack, including both
# APIs, is that file. Token files are written at start and are not committed.
services:
  otel-collector:
    image: otel/opentelemetry-collector-contrib:0.109.0
    command: ["--config=/etc/otel-collector.yaml"]
    volumes:
      - ./otel-collector.yaml:/etc/otel-collector.yaml:ro
    ports:
      - "127.0.0.1:4318:4318"

  prometheus:
    image: prom/prometheus:v2.54.1
    entrypoint: ["/bin/sh", "/etc/prometheus/prometheus-entrypoint.sh"]
    command: []
    environment:
      QUANT_API_KEY: ${QUANT_API_KEY:?set QUANT_API_KEY in the environment}
      RESEARCH_API_KEY: ${RESEARCH_API_KEY:?set RESEARCH_API_KEY in the environment}
    volumes:
      - ./prometheus.yml:/etc/prometheus/prometheus.yml:ro
      - ./alerts.yml:/etc/prometheus/alerts.yml:ro
      - ./prometheus-entrypoint.sh:/etc/prometheus/prometheus-entrypoint.sh:ro
    ports:
      - "127.0.0.1:9090:9090"

  grafana:
    image: grafana/grafana:11.2.0
    environment:
      GF_AUTH_ANONYMOUS_ENABLED: "true"
      GF_AUTH_ANONYMOUS_ORG_ROLE: Viewer
    volumes:
      - ./grafana/provisioning:/etc/grafana/provisioning:ro
      - ./grafana/dashboards:/var/lib/grafana/dashboards:ro
    ports:
      - "127.0.0.1:3000:3000"
    depends_on:
      - prometheus
