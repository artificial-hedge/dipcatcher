global:
  scrape_interval: 15s

rule_files:
  - alerts.yml
  - slo_rules.yml

scrape_configs:
  - job_name: lab-api
    authorization:
      type: Bearer
      credentials_file: /tmp/lab.token
    static_configs:
      - targets: ["lab-a:9464", "lab-b:9464"]
  - job_name: research-api
    authorization:
      type: Bearer
      credentials_file: /tmp/research.token
    static_configs:
      - targets: ["research-a:9464", "research-b:9464"]
