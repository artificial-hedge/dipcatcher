repos:
  - repo: https://github.com/pre-commit/pre-commit-hooks
    rev: v5.0.0
    hooks:
      - id: check-yaml
      - id: check-toml
      - id: check-json
      - id: check-merge-conflict
      - id: check-case-conflict
  - repo: https://github.com/astral-sh/ruff-pre-commit
    # Pinned to the uv.lock ruff version (currently 0.16.9) — pre-commit and
    # `make lint` must not drift (they used to: rev v0.8.0 vs locked 0.16.x;
    # then v0.16.7 vs locked 0.16.9). Re-pin here whenever uv.lock bumps ruff.
    rev: v0.16.9
    hooks:
      - id: ruff
        args: [--fix]
      - id: ruff-format
  - repo: https://github.com/gitleaks/gitleaks
    rev: v8.30.1
    hooks:
      # Staged diff only. Uses .gitleaks.toml. CI scans full history.
      - id: gitleaks
  - repo: local
    hooks:
      # Local hooks run through `uv run`/`uvx` so tool versions come from
      # uv.lock (mypy) or an explicit pin (bandit) — matching CI exactly.
      # Hook <-> Make target parity (do not let these drift):
      #   ruff / ruff-format      -> `make lint`   (ruff check + format --check)
      #   mypy-strict-allowlist   -> `make lint`   (check_mypy_strict_allowlist.py)
      #   mypy                    -> `make typecheck`
      #   mypy-strict-public      -> `make typecheck` (strict public modules)
      #   mypy-fx1                -> `make fx1-test` lane's type pass
      #   bandit                  -> `make security`
      #   uv-lock-check           -> `make sync`'s --frozen precondition
      - id: mypy
        name: mypy (uv run)
        entry: uv run mypy src/quant_fund
        language: system
        pass_filenames: false
        types: [python]
      - id: mypy-strict-public
        name: mypy strict public modules (uv run)
        entry: uv run mypy --strict --follow-imports=silent src/quant_fund/__init__.py src/quant_fund/public.py
        language: system
        pass_filenames: false
        types: [python]
      - id: mypy-strict-allowlist
        name: mypy strict allowlist ratchet (uv run)
        entry: uv run python scripts/check_mypy_strict_allowlist.py
        language: system
        pass_filenames: false
        types: [python]
      - id: mypy-fx1
        name: mypy fx1 (uv run)
        entry: uv run mypy src/fx1
        language: system
        pass_filenames: false
        types: [python]
      - id: bandit
        name: bandit (uvx pinned)
        entry: uvx --from bandit==1.9.4 bandit -q -r src --severity-level medium --confidence-level medium
        language: system
        pass_filenames: false
        types: [python]
      - id: secret-scan
        name: secret-scan (staged diff)
        entry: uv run python scripts/secret_scan.py
        language: system
        pass_filenames: false
      # Lockfile must stay in sync with pyproject — a stale uv.lock broke
      # `uv sync --frozen` once already; fail the commit instead.
      - id: uv-lock-check
        name: uv lock --check
        entry: uv lock --check
        language: system
        pass_filenames: false
        files: ^(pyproject\.toml|uv\.lock)$
