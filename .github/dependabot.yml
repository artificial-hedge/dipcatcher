version: 2
updates:
  # Python dependencies. uv.lock is the lockfile CI installs with
  # `uv sync --frozen`. Dependabot's uv ecosystem opens PRs that update
  # both pyproject.toml and uv.lock.
  - package-ecosystem: uv
    directory: /
    schedule:
      interval: weekly
    open-pull-requests-limit: 5
    groups:
      dev-tools:
        patterns:
          - pytest*
          - hypothesis
          - ruff
          - mypy
          - pre-commit
  # PEP 621 / pip ecosystem for the same manifest. A pip PR that does not
  # refresh uv.lock fails `uv lock --check` in CI; merge the uv PR when both
  # open for the same bump. Kept so the pip ecosystem is configured, which
  # is what Scorecard and reviewers look for alongside GitHub Actions.
  - package-ecosystem: pip
    directory: /
    schedule:
      interval: weekly
    open-pull-requests-limit: 5
    groups:
      dev-tools:
        patterns:
          - pytest*
          - hypothesis
          - ruff
          - mypy
          - pre-commit
  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: weekly
    open-pull-requests-limit: 5
    groups:
      actions:
        patterns:
          - "*"
  # --- JS/TS supply chain (docs/SOTA/18-security.md F4) -------------------
  # Both trees commit a package-lock.json and install with `npm ci` in CI
  # (web_explorer.yml, replay_viz.yml), so Dependabot can propose
  # lockfile-respecting bumps. Grouping matches the existing convention so a
  # weekly run opens one PR per tree instead of a dozen.
  - package-ecosystem: npm
    directory: /web
    schedule:
      interval: weekly
      day: monday
    open-pull-requests-limit: 5
    groups:
      web-tooling:
        patterns:
          - "*"
  - package-ecosystem: npm
    directory: /replay
    schedule:
      interval: weekly
      day: monday
    open-pull-requests-limit: 5
    groups:
      replay-tooling:
        patterns:
          - "*"
  # --- Rust supply chain --------------------------------------------------
  # rust/quant_core commits Cargo.lock and ci.yml's rust-accel job builds it
  # with `cargo clippy --locked`. Not covered by the uv/pip ecosystems, so
  # crate bumps had no update path at all until now.
  - package-ecosystem: cargo
    directory: /rust/quant_core
    schedule:
      interval: weekly
      day: monday
    open-pull-requests-limit: 5
    groups:
      rust-crates:
        patterns:
          - "*"
