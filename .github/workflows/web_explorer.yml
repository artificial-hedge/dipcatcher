name: Web Explorer

on:
  # Doc-only pushes must not run this non-doc lane. GitHub forbids `paths` and
  # `paths-ignore` on the same event (the workflow would never run at all), so
  # the equivalent filter is applied by dropping docs/WEB_EXPLORER.md from
  # `paths` below: a push touching only docs/** or *.md no longer matches.
  push:
    branches: [main]
    paths:
      - "web/**"
      - "tests/unit/web_explorer/**"
      - ".github/workflows/web_explorer.yml"
      - "receipts/**"
      - "artifacts/*.json"
  pull_request:
    branches: [main]
    paths:
      - "web/**"
      - "tests/unit/web_explorer/**"
      - ".github/workflows/web_explorer.yml"
      - "receipts/**"
      - "artifacts/*.json"

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

# pull_request and push skip these jobs unless repository variable
# USE_CURSOR_CI is exactly "false". ci.yml package and docs.yml build still
# run on push. Other events this file already triggers still run. See docs/CURSOR_CI.md.
jobs:
  build-and-unit:
    if: "github.event_name != 'pull_request' && github.event_name != 'push' || vars.USE_CURSOR_CI == 'false'"
    runs-on: instabox-large
    timeout-minutes: 20
    defaults:
      run:
        working-directory: web
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          persist-credentials: false
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: web/package-lock.json
      - name: Install
        run: npm ci
      - name: Unit tests (vitest)
        run: npm run test
      - name: Build static bundle
        run: npm run build
      - name: Check fixtures are committed
        run: test -f public/fixtures/index.json
      - name: Upload dist
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7
        with:
          name: web-explorer-dist
          path: web/dist/
          if-no-files-found: error

  e2e:
    if: "github.event_name != 'pull_request' && github.event_name != 'push' || vars.USE_CURSOR_CI == 'false'"
    needs: [build-and-unit]
    runs-on: instabox-large
    timeout-minutes: 30
    defaults:
      run:
        working-directory: web
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          persist-credentials: false
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: web/package-lock.json
      - name: Install
        run: npm ci
      - name: Build static bundle
        run: npm run build
      - name: Install Playwright browser
        run: npx playwright install --with-deps chromium
      - name: Playwright tests
        run: npx playwright test
      - name: Upload Playwright report
        if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7
        with:
          name: web-explorer-playwright-report
          path: web/playwright-report/
          if-no-files-found: warn
