name: atlas

# Freshness gate for the architecture atlas: the committed Mermaid
# diagrams and manifest under docs/architecture/ (plus the embedded blocks
# in docs/ARCHITECTURE_ATLAS.md) must match what
# scripts/gen_arch_diagrams.py produces from the current source tree.

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  # Additive merge-queue trigger (docs/SOTA/16-ci-cd.md §4.1).
  merge_group:
    branches: [main]

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  diagrams:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      # Routes through the composite so the setup-uv pin lives in exactly one
      # place (.github/actions/uv-setup/action.yml). This replaces the drifted
      # `astral-sh/setup-uv@… # v5` pin with the repo-majority v10.2.0 — see
      # docs/SOTA/16-ci-cd.md finding G2.
      - uses: ./.github/actions/uv-setup
        with:
          python-version: "3.12"
          sync-args: "--all-groups"
      - name: Architecture diagrams fresh
        run: uv run --frozen python scripts/gen_arch_diagrams.py --check
      - name: Atlas unit tests
        run: uv run --frozen pytest tests/unit/docs -q
