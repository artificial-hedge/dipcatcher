name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main, p1/historical-receipts-20260925]
  schedule:
    # Full offline suite, including tests marked slow. PR runs stay on the fast subset.
    - cron: "17 6 * * *"
  workflow_dispatch:
    inputs:
      suite:
        description: "fast excludes slow tests; full runs them"
        required: false
        default: full
        type: choice
        options:
          - full
          - fast

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  # Do NOT cancel in-flight runs. At this repo's push cadence (measured: 12
  # merges in 68s) cancel-in-progress meant every run was superseded before it
  # could finish — 400 consecutive attempts, zero successes. A gate that is
  # always cancelled emits no verdict, so it cannot protect the branch. The
  # group key still serialises runs; letting them drain is the whole point.
  cancel-in-progress: false

# Least privilege. Cache and artifact services use runner-scoped runtime
# tokens; the workflow's GITHUB_TOKEN never needs Actions write access.
permissions:
  contents: read

jobs:
  lint:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: astral-sh/setup-uv@c18668ad3cf93ea998bef934396af7bb5c839dc7 # v10.2.0
        with:
          python-version: "3.12"
          enable-cache: true
          cache-dependency-glob: uv.lock
      - name: Sync
        run: uv sync --frozen --all-groups
      - name: Ruff
        run: uv run ruff check src tests
      - name: Ruff format check
        continue-on-error: true
        run: uv run ruff format --check src tests
      - name: Mypy
        run: uv run mypy src/quant_fund
      - name: Mypy strict allowlist
        run: uv run python scripts/check_mypy_strict_allowlist.py
      - name: McCabe complexity ratchet
        run: uv run python scripts/check_mccabe_ratchet.py
      - name: Mypy public API (strict)
        run: uv run mypy --strict --follow-imports=silent src/quant_fund/__init__.py src/quant_fund/public.py
      - name: Static security analysis
        run: uvx --from bandit==1.9.4 bandit -q -r src --severity-level medium --confidence-level medium

  audit:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: astral-sh/setup-uv@c18668ad3cf93ea998bef934396af7bb5c839dc7 # v10.2.0
        with:
          python-version: "3.12"
          enable-cache: true
          cache-dependency-glob: uv.lock
      - name: Sync
        run: uv sync --frozen --all-groups
      - name: Lockfile consistency
        run: uv lock --check
      - name: Dependency vulnerability audit
        run: |
          set -o pipefail
          uv export --frozen --quiet --format requirements.txt --no-hashes --no-emit-project \
            --all-extras --all-groups -o /tmp/locked-requirements.txt
          # Audit every platform's locked packages, including the Windows/Linux
          # optional packages that the Ubuntu runner would otherwise skip.
          sed 's/ ;.*//' /tmp/locked-requirements.txt > /tmp/all-platform-requirements.txt
          uvx --from pip-audit==2.10.1 pip-audit --strict --disable-pip --no-deps \
            --format json -r /tmp/all-platform-requirements.txt \
            | tee dependency-audit.json
      - name: Upload dependency audit
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: dipcatcher-dependency-audit
          path: dependency-audit.json
          if-no-files-found: error

  package:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    permissions:
      contents: read
      id-token: write
      attestations: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: astral-sh/setup-uv@c18668ad3cf93ea998bef934396af7bb5c839dc7 # v10.2.0
        with:
          python-version: "3.12"
          enable-cache: true
          cache-dependency-glob: uv.lock
      - name: Sync locked dependencies without installing the workspace
        run: uv sync --frozen --all-groups --no-install-project
      - name: Build wheel and source distribution
        run: uv build
      - name: Install wheel and smoke-test the installed console scripts
        run: |
          uv pip install --python .venv/bin/python --no-deps dist/*.whl
          .venv/bin/fx1 --help
          .venv/bin/dipcatcher --help
      - name: Attest build provenance (SLSA)
        # Main pushes only: fork PRs cannot mint id-tokens, and provenance
        # matters at release boundaries, not per-PR.
        if: github.event_name == 'push'
        uses: actions/attest-build-provenance@4d101475d8b20a2381f78447822ac1eab6504dd8 # v4.2.2
        with:
          subject-path: |
            dist/*.whl
            dist/*.tar.gz

  container:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Build runtime image
        run: docker build --pull --tag dipcatcher-ci .
      - name: Start container
        run: docker run --detach --name dipcatcher-ci dipcatcher-ci
      - name: Wait for container health check
        run: |
          for _ in $(seq 1 30); do
            status="$(docker inspect --format='{{.State.Health.Status}}' dipcatcher-ci)"
            if [ "$status" = "healthy" ]; then
              exit 0
            fi
            if [ "$status" = "unhealthy" ]; then
              docker logs dipcatcher-ci
              exit 1
            fi
            sleep 2
          done
          docker logs dipcatcher-ci
          exit 1
      - name: Remove runtime container
        if: always()
        run: docker rm --force dipcatcher-ci || true

  test:
    runs-on: ubuntu-latest
    timeout-minutes: 75
    env:
      HYPOTHESIS_PROFILE: ci
      # Makefile TEST_ENV block, mirrored (keep both sides identical).
      # Validated fix for the three-OpenMP-runtime NULL-kmp_info segfault under
      # xdist (.dsh-24x7/lane_reports/l3-segfault.md 7.1): OMP_NUM_THREADS=1
      # keeps libomp out of __kmp_suspend_* (the crashing stack);
      # KMP_INIT_AT_FORK=FALSE closes the fork() route; PYTHONFAULTHANDLER=1
      # captures any future native fault. Matches the fleet job manifests
      # (AGENTS.md "Thread pinning").
      OMP_NUM_THREADS: "1"
      MKL_NUM_THREADS: "1"
      NUMEXPR_NUM_THREADS: "1"
      VECLIB_MAXIMUM_THREADS: "1"
      KMP_INIT_AT_FORK: "FALSE"
      PYTHONFAULTHANDLER: "1"
      TOKENIZERS_PARALLELISM: "false"
    strategy:
      fail-fast: false
      matrix:
        python: ["3.12", "3.13"]
        shard: [1, 2, 3, 4]
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
          # Historical receipt tests resolve archived source commits.
          fetch-depth: 0
      - uses: astral-sh/setup-uv@c18668ad3cf93ea998bef934396af7bb5c839dc7 # v10.2.0
        with:
          python-version: ${{ matrix.python }}
          enable-cache: true
          cache-dependency-glob: uv.lock
      # No ~/.cache/pip cache on purpose: this environment is uv-managed
      # (setup-uv caches ~/.cache/uv via enable-cache) and nothing in this job
      # invokes pip, so that cache could only ever save an empty directory.
      - name: Cache synthetic lakes and Northset benches
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: ~/.cache/dipcatcher
          key: dipcatcher-session-${{ runner.os }}-py${{ matrix.python }}-${{ hashFiles('src/quant_fund/**/*.py') }}
          restore-keys: |
            dipcatcher-session-${{ runner.os }}-py${{ matrix.python }}-
      - name: Sync
        run: uv sync --frozen --all-groups --all-extras
      - name: Pytest
        env:
          INPUT_SUITE: ${{ inputs.suite }}
        run: |
          set -euo pipefail
          suite="fast"
          if [ "${GITHUB_EVENT_NAME}" = "schedule" ]; then
            suite="full"
          elif [ "${GITHUB_EVENT_NAME}" = "workflow_dispatch" ]; then
            suite="${INPUT_SUITE:-fast}"
          fi
          if [ "$suite" = "full" ]; then
            marker='not network'
          else
            marker='not network and not slow'
          fi
          args=(
            -q
            -n auto
            --dist loadfile
            -m "$marker"
            --splits 4
            --group "${{ matrix.shard }}"
            --durations-path .test_durations
            # least_duration keeps per-shard predicted runtime flat; the default
            # duration_based_chunks algorithm packs contiguous collection ranges
            # and left wall-clock skewed under xdist --dist loadfile.
            --splitting-algorithm least_duration
          )
          if [ "${{ matrix.python }}" = "3.12" ]; then
            # Partial shards stay under the project threshold; the coverage job combines them.
            args+=(--cov --cov-report=xml:coverage.xml --cov-fail-under=0)
          fi
          uv run pytest "${args[@]}"
      - name: Stage coverage data
        if: matrix.python == '3.12' && !cancelled()
        run: |
          set -euo pipefail
          shopt -s nullglob
          mkdir -p coverage-upload
          files=(.coverage .coverage.*)
          if [ "${#files[@]}" -eq 0 ]; then
            echo "pytest-cov did not write a coverage data file" >&2
            exit 1
          fi
          cp "${files[@]}" coverage.xml coverage-upload/
      - name: Upload coverage shard
        if: matrix.python == '3.12' && !cancelled()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: dipcatcher-coverage-3.12-${{ matrix.shard }}
          path: coverage-upload
          # .coverage is a hidden file; upload-artifact skips those by default.
          include-hidden-files: true
          if-no-files-found: error

  coverage:
    needs: [test]
    if: ${{ !cancelled() }}
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: astral-sh/setup-uv@c18668ad3cf93ea998bef934396af7bb5c839dc7 # v10.2.0
        with:
          python-version: "3.12"
          enable-cache: true
          cache-dependency-glob: uv.lock
      - name: Sync
        run: uv sync --frozen --all-groups --all-extras
      - name: Download coverage shards
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          pattern: dipcatcher-coverage-3.12-*
          path: coverage-parts
      - name: Combine coverage and enforce threshold
        run: |
          set -euo pipefail
          shopt -s nullglob
          mkdir -p combined
          i=0
          # Each shard's controller already combined worker data into .coverage.
          # Combining those files again with the worker fragments would
          # double-count. Fall back to fragments only when .coverage is absent.
          for part in coverage-parts/*/; do
            if [ -f "${part}.coverage" ]; then
              i=$((i + 1))
              cp "${part}.coverage" "combined/.coverage.shard${i}"
              continue
            fi
            for data in "${part}".coverage.*; do
              if [ -f "$data" ]; then
                i=$((i + 1))
                cp "$data" "combined/.coverage.shard${i}"
              fi
            done
          done
          if [ "$i" -eq 0 ]; then
            echo "no coverage data files were downloaded" >&2
            exit 1
          fi
          cd combined
          uv run coverage combine
          uv run coverage xml -o "$GITHUB_WORKSPACE/coverage.xml"
          uv run coverage report
      - name: Upload coverage
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: dipcatcher-coverage
          path: coverage.xml
          if-no-files-found: error

  perf:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: astral-sh/setup-uv@c18668ad3cf93ea998bef934396af7bb5c839dc7 # v10.2.0
        with:
          python-version: "3.12"
          enable-cache: true
          cache-dependency-glob: uv.lock
      - name: Sync
        run: uv sync --frozen --group dev
      - name: Synthetic performance subset
        run: |
          uv run pytest tests/perf -q -m "not perf_full" -o addopts= --strict-markers \
            --benchmark-only --benchmark-min-rounds=5 --benchmark-max-time=2 \
            --benchmark-warmup=on --benchmark-disable-gc \
            --benchmark-json=perf-ci.json
      - name: Flag calibration-normalized regressions
        run: |
          uv run python tests/perf/check_regression.py perf-ci.json \
            tests/perf/baselines/baseline.json --threshold 0.50 --ci
      - name: Upload performance results
        if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: dipcatcher-perf
          path: perf-ci.json
          if-no-files-found: error

  smoke:
    needs: [test, lint]
    if: ${{ !cancelled() }}
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: astral-sh/setup-uv@c18668ad3cf93ea998bef934396af7bb5c839dc7 # v10.2.0
        with:
          python-version: "3.12"
          enable-cache: true
          cache-dependency-glob: uv.lock
      - name: Sync
        run: uv sync --frozen --all-groups
      - name: Collect paper and analytics tests
        run: uv run pytest --collect-only -q -m smoke
      - name: Synthetic research smoke
        run: uv run dipcatcher research --config configs/research.yaml
      - name: Data lineage health
        run: |
          uv run dipcatcher doctor --config configs/research.yaml | tee doctor.txt
          grep -q '^data_manifest: ok$' doctor.txt
          grep -q '^live_allowed: False$' doctor.txt
      - name: Paper shadow smoke
        run: |
          uv run dipcatcher paper --config configs/paper.yaml --max-steps 2 > paper-smoke.json
          uv run python - <<'PY'
          import json
          from pathlib import Path
          from quant_fund.paper.ledger import validate_ledger_schema

          text = Path("paper-smoke.json").read_text()
          lines = text.splitlines()
          try:
              start = next(i for i, line in enumerate(lines) if line.strip() == "{")
          except StopIteration:
              raise SystemExit("paper smoke did not emit a result")
          result = json.loads("\n".join(lines[start:]))
          if result.get("research_only") is not True:
              raise SystemExit("paper smoke is not research-only")
          if result.get("live_pnl_claim") is not False:
              raise SystemExit("paper smoke made a live P&L claim")
          for name in ("orders", "equity", "broker_state", "promotion_dry_run"):
              if not Path(result["paths"][name]).is_file():
                  raise SystemExit(f"paper artifact missing: {name}")
          ledger = validate_ledger_schema(Path(result["paths"]["orders"]).parent)
          if not ledger["ok"]:
              raise SystemExit(f"paper ledger invalid: {ledger['errors']}")
          print("validated paper shadow smoke")
          PY
      - name: Upload paper shadow evidence
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: dipcatcher-paper-shadow-smoke
          path: data/metadata/paper/
          if-no-files-found: error
      - name: Validate research artifact
        run: |
          uv run dipcatcher verify-research
          uv run python - <<'PY'
          import json
          from pathlib import Path
          from quant_fund.research.verify import REQUIRED_BENCHMARK_FAMILIES

          path = Path("data/metadata/research/latest.json")
          notebook = json.loads(path.read_text())
          provenance = notebook["provenance"]
          required = {
              "run_id", "git_revision", "config_sha256", "dataset_sha256",
              "git_worktree_sha256", "dataset_content_sha256", "row_count", "column_count",
              "point_in_time", "execution_claim", "benchmark_catalog_version",
          }
          missing = required - provenance.keys()
          if missing:
              raise SystemExit(f"missing provenance fields: {sorted(missing)}")
          if provenance["point_in_time"] is not True:
              raise SystemExit("research artifact is not marked point-in-time")
          if provenance["execution_claim"] != "research_only":
              raise SystemExit("research artifact has an invalid execution claim")
          if provenance["benchmark_catalog_version"] != 2:
              raise SystemExit("research artifact has an invalid benchmark catalog version")
          if notebook["data_source"] != "SYNTHETIC":
              raise SystemExit("CI smoke must remain explicitly synthetic")
          scorecard = notebook.get("scorecard", {})
          missing_families = REQUIRED_BENCHMARK_FAMILIES - scorecard.keys()
          if missing_families:
              raise SystemExit(f"missing benchmark families: {sorted(missing_families)}")
          if not scorecard or not all(
              item.get("executed") and item.get("nonempty")
              and item.get("finite_observation")
              and item.get("forbidden_metrics_absent")
              for item in scorecard.values()
          ):
              raise SystemExit("research scorecard is incomplete or contains forbidden metrics")
          # artifacts are stored relative to the receipt dir (see run_research);
          # resolve them from the receipt's own directory, not the repo root.
          run_json = path.parent / notebook["artifacts"]["immutable_json"]
          run_md = path.parent / notebook["artifacts"]["immutable_markdown"]
          if not run_json.is_file() or not run_md.is_file():
              raise SystemExit("immut[+12930 bytes at .content[1].resource.text]