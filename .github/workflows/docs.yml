name: docs

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

# NOTE: deliberately NOT filtered with paths-ignore. This workflow runs
# `mkdocs build --strict`, whose whole job is to catch a broken nav reference,
# bad link, or malformed page — so a Markdown change is exactly the change that
# can break it. An earlier revision added `paths-ignore: ['**/*.md','docs/**']`
# here on the theory that doc churn is harmless; that is inverted and would have
# meant this workflow never ran for the files it exists to validate. Budget is
# reclaimed in matrix.yml (36 jobs), not here.

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

# PRs only build. Push to main uploads a Pages artifact and deploys it when
# GitHub Pages is enabled. GET /repos/.../pages is HTTP 404 (has_pages=false)
# and creating the site returns 403 for this integration, so deploy-pages can
# never succeed until a repo admin enables Pages. A 404 from that probe skips
# deploy-pages and leaves the strict mkdocs build as the check. Any other
# probe status, and deploy-pages itself once the site exists, still fail the
# job. No continue-on-error.
permissions:
  contents: read

jobs:
  build:
    runs-on: instabox-large
    timeout-minutes: 20
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: astral-sh/setup-uv@c18668ad3cf93ea998bef934396af7bb5c839dc7 # v10.2.0
        with:
          python-version: "3.12"
          enable-cache: true
          cache-dependency-glob: uv.lock
      - name: Lockfile consistency
        run: uv lock --check
      - name: Sync documentation environment
        run: uv sync --frozen --only-group docs --no-build
      - name: Build strict site
        run: uv run --only-group docs --frozen mkdocs build --strict
      - name: Upload Pages artifact
        if: github.event_name == 'push' && github.ref == 'refs/heads/main'
        uses: actions/upload-pages-artifact@fc324d3547104276b827a68afc52ff2a11cc49c9 # v5
        with:
          path: site

  deploy:
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    needs: build
    runs-on: instabox-large
    timeout-minutes: 10
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    permissions:
      pages: write
      id-token: write
    steps:
      - name: Detect GitHub Pages site
        id: pages
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          code=$(curl -sS -o /dev/null -w '%{http_code}' \
            -H "Authorization: Bearer ${GH_TOKEN}" \
            -H "Accept: application/vnd.github+json" \
            "${GITHUB_API_URL}/repos/${GITHUB_REPOSITORY}/pages" || true)
          echo "http_code=${code}" >> "$GITHUB_OUTPUT"
          if [ "${code}" = "404" ]; then
            echo "enabled=false" >> "$GITHUB_OUTPUT"
            echo "deploy skipped: GitHub Pages is not enabled (has_pages=false, Pages API HTTP 404)"
          elif [ "${code}" = "200" ]; then
            echo "enabled=true" >> "$GITHUB_OUTPUT"
          else
            echo "Pages API returned HTTP ${code}; not skipping deploy" >&2
            exit 1
          fi
      - name: Deploy to GitHub Pages
        id: deployment
        if: steps.pages.outputs.enabled == 'true'
        uses: actions/deploy-pages@368f82528645a54fb793d4d04e342629a3f51346 # v5
