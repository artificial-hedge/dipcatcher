# Architecture boundary guards (docs/ARCHITECTURE_GUARDS.md) — additive workflow.
# Nothing here weakens ci.yml: the checker is stdlib-only so this job needs no
# dependency sync and fails fast on import-boundary violations.
name: arch-guards

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

# pull_request and push skip these jobs unless repository variable
# USE_CURSOR_CI is exactly "false". ci.yml package and docs.yml build still
# run on push. Other events this file already triggers still run. See docs/CURSOR_CI.md.
jobs:
  import-boundaries:
    if: "github.event_name != 'pull_request' && github.event_name != 'push' || vars.USE_CURSOR_CI == 'false'"
    runs-on: instabox-large
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: astral-sh/setup-uv@c18668ad3cf93ea998bef934396af7bb5c839dc7 # v10.2.0
        with:
          python-version: "3.12"
      - name: Import boundary check
        # stdlib-only script; --no-project avoids syncing the workspace env.
        run: uv run --no-project python scripts/check_import_boundaries.py
      - name: Checker unit tests
        run: uv run --no-project python -m unittest tests.unit.arch.test_import_boundaries
