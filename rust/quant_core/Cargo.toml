[package]
name = "quant_core"
version = "0.1.0"
edition = "2021"
description = "Optional native kernels for dipcatcher numeric hot paths"
publish = false
license = "LicenseRef-proprietary"

[lib]
name = "quant_core"
crate-type = ["cdylib"]

[dependencies]
numpy = "0.29"
pyo3 = { version = "0.29", features = ["extension-module"] }
sha2 = "0.10"

# Enable runtime-detected ARM SHA-256 acceleration, retaining the software fallback.
[target.'cfg(target_arch = "aarch64")'.dependencies]
sha2 = { version = "0.10", features = ["asm"] }
