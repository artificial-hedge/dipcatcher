services:
  mlflow:
    # NOTE: the Python client is pinned by uv.lock (mlflow 3.x) while this
    # server image is 2.17.2 — align them before relying on newer registry
    # features. Host binding stays loopback; the server is unauthenticated.
    #
    # Pinned by digest (multi-arch index for v2.17.2, resolved from GHCR
    # 2026-10-08); the tag stays for readability only. Bump the tag AND the
    # digest together.
    image: ghcr.io/mlflow/mlflow:v2.17.2@sha256:30ae1090a3404f3914d7c21f63a949433b07b8b102f9dc9eb9bf59b8ce5c710b
    profiles: ["optional"]
    restart: unless-stopped
    ports:
      - "127.0.0.1:5000:5000"
    command: mlflow server --host 0.0.0.0 --backend-store-uri sqlite:////mlflow/mlflow.db --default-artifact-root /mlruns
    volumes:
      # SQLite backend store lives on its own volume so removing the container
      # cannot wipe experiment history.
      - mlflow-db:/mlflow
      - mlflow-data:/mlruns
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://127.0.0.1:5000/health', timeout=3)"]
      interval: 30s
      timeout: 5s
      start_period: 20s
      retries: 3

volumes:
  mlflow-data:
  mlflow-db:
