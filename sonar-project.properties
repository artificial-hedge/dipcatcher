# SonarCloud Automatic Analysis — in-repo scope only.
# Quality Gate conditions (Reliability/Security Rating on New Code ≥ A) live
# on the SonarCloud project dashboard and cannot be rewritten from the repo.
# 2026-10-16 main QG: new_reliability_rating=C (161 bugs), new_security_rating=E
# (680 vulns, 14 BLOCKER). Cleared here are non-product / false-positive sinks
# that inflate ncloc and BLOCKER secret-key matches in branch-name archives.
sonar.projectKey=artificial-hedge_dipcatcher
sonar.organization=artificial-hedge
sonar.python.version=3.12

# Product sources. Tests stay visible for coverage but are not scored as prod.
sonar.sources=src,scripts,.github/workflows
sonar.tests=tests
sonar.test.inclusions=tests/**/*

# Exclude generated capability dumps, receipt/evidence corpora, branch-name
# archives (json:S6418 false positives on "token"/"auth"/"secret" in ref names),
# and other non-runtime trees. Do not exclude src/quant_fund or src/fx1.
sonar.exclusions=\
  **/__pycache__/**,\
  **/*.pyc,\
  scripts/generated_capability_declarations/**,\
  scripts/**/corpus_epoch_*.json,\
  .github/workflows/corpus_epoch_*.json,\
  docs/**,\
  receipts/**,\
  quality/corpus_epoch_*.json,\
  quality/**/*.json,\
  artifacts/**,\
  data/**,\
  third_party/**,\
  web/**,\
  clients/**,\
  research/**,\
  replay/**,\
  reports/**,\
  notebooks/**,\
  verifier/**,\
  .dsh-24x7/**

sonar.coverage.exclusions=\
  **/__main__.py,\
  scripts/**,\
  .github/workflows/**

sonar.cpd.exclusions=\
  scripts/generated_capability_declarations/**,\
  **/corpus_epoch_*.json
