# SonarCloud Automatic Analysis — in-repo scope only.
# Quality Gate (Reliability/Security Rating on New Code ≥ A) is configured on
# the SonarCloud dashboard and cannot be rewritten from the repo. QG fails
# while new code carries any bug/vuln (2026-10-16: Reliability C / Security E,
# ~662 vulns incl. ~542× python:S2245 insecure-random in research sims).
# Clearing that backlog or resetting the new-code baseline needs org admin.
sonar.projectKey=artificial-hedge_dipcatcher
sonar.organization=artificial-hedge
sonar.python.version=3.12

sonar.sources=src,scripts,.github/workflows
sonar.tests=tests
sonar.test.inclusions=tests/**/*

# Single-line exclusions (multiline backslash lists are fragile under Automatic
# Analysis). docs/BRANCH_ARCHIVE.json alone accounts for many json:S6418
# BLOCKERs (branch names containing token/auth/secret).
sonar.exclusions=**/__pycache__/**,**/*.pyc,scripts/generated_capability_declarations/**,**/corpus_epoch_*.json,docs/**,docs/BRANCH_ARCHIVE.json,receipts/**,quality/**,artifacts/**,data/**,third_party/**,web/**,clients/**,research/**,replay/**,reports/**,notebooks/**,verifier/**,.dsh-24x7/**

sonar.coverage.exclusions=**/__main__.py,scripts/**,.github/workflows/**
sonar.cpd.exclusions=scripts/generated_capability_declarations/**,**/corpus_epoch_*.json
